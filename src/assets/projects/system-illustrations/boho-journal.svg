<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60796b"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c8d1c5"/></pattern></defs><rect width="1100" height="620" fill="#e7ece2"/><rect width="1100" height="620" fill="url(#grid)"/><text x="55" y="54" font-family="Arial, sans-serif" font-size="13" fill="#25372f">KAI INDIGO WOLF / SYSTEM NOTES</text><text x="55" y="111" font-family="Georgia, serif" font-size="38" fill="#25372f">One writing surface. Replaceable storage.</text><text x="55" y="147" font-family="Arial, sans-serif" font-size="17" fill="#25372f">Boho Journal · a typed storage contract behind application state</text><rect x="55" y="280" width="245" height="96" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="77" y="317" font-family="Arial, sans-serif" font-size="22" fill="#25372f">React editor</text><text x="77" y="346" font-family="Arial, sans-serif" font-size="15" fill="#25372f">Entry content and context</text><rect x="390" y="280" width="270" height="96" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="412" y="317" font-family="Arial, sans-serif" font-size="22" fill="#25372f">Zustand store</text><text x="412" y="346" font-family="Arial, sans-serif" font-size="15" fill="#25372f">Selection · CRUD · loading</text><rect x="770" y="280" width="275" height="96" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="792" y="317" font-family="Arial, sans-serif" font-size="22" fill="#25372f">StorageAdapter</text><text x="792" y="346" font-family="Arial, sans-serif" font-size="15" fill="#25372f">list / get / create / update</text><path d="M300 328 H390" fill="none" stroke="#60796b" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 328 H770" fill="none" stroke="#60796b" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="425" width="275" height="80" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="792" y="462" font-family="Arial, sans-serif" font-size="22" fill="#25372f">Supabase</text><text x="792" y="491" font-family="Arial, sans-serif" font-size="15" fill="#25372f">Current selected adapter</text><path d="M908 376 V425" fill="none" stroke="#60796b" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="444" font-family="Arial, sans-serif" font-size="18" fill="#25372f">Update local entries after</text><text x="400" y="473" font-family="Arial, sans-serif" font-size="18" fill="#25372f">the storage operation succeeds.</text><path d="M55 550 H1045" stroke="#9aa99b"/><text x="55" y="583" font-family="Arial, sans-serif" font-size="14" fill="#25372f">Local and Memos adapter files explore alternatives to the selected persistence layer.</text><text x="886" y="583" font-family="Arial, sans-serif" font-size="11" fill="#25372f">IMPLEMENTATION SKETCH</text></svg>