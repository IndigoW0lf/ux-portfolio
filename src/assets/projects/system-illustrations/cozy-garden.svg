<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60796b"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c8d1c5"/></pattern></defs><rect width="1100" height="620" fill="#e7ece2"/><rect width="1100" height="620" fill="url(#grid)"/><text x="55" y="54" font-family="Arial, sans-serif" font-size="13" fill="#25372f">KAI INDIGO WOLF / SYSTEM NOTES</text><text x="55" y="111" font-family="Georgia, serif" font-size="38" fill="#25372f">A clock ticks. The reducer grows the garden.</text><text x="55" y="147" font-family="Arial, sans-serif" font-size="17" fill="#25372f">Cozy Garden Simulator · entity state and timed transitions</text><rect x="55" y="235" width="260" height="96" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="77" y="272" font-family="Arial, sans-serif" font-size="22" fill="#25372f">Timer component</text><text x="77" y="301" font-family="Arial, sans-serif" font-size="15" fill="#25372f">Dispatch growth updates</text><rect x="405" y="235" width="290" height="96" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="427" y="272" font-family="Arial, sans-serif" font-size="22" fill="#25372f">Garden reducer</text><text x="427" y="301" font-family="Arial, sans-serif" font-size="15" fill="#25372f">Update one plant by ID</text><rect x="785" y="235" width="260" height="96" rx="12" fill="#f9f7f0" stroke="#789084"/><text x="807" y="272" font-family="Arial, sans-serif" font-size="22" fill="#25372f">Plant state</text><text x="807" y="301" font-family="Arial, sans-serif" font-size="15" fill="#25372f">Stage + time remaining</text><path d="M315 283 H405" fill="none" stroke="#60796b" stroke-width="2" marker-end="url(#arrow)"/><path d="M695 283 H785" fill="none" stroke="#60796b" stroke-width="2" marker-end="url(#arrow)"/><path d="M915 331 V395 H185 V331" fill="none" stroke="#60796b" stroke-width="2" marker-end="url(#arrow)"/><text x="370" y="385" font-family="Arial, sans-serif" font-size="17" fill="#25372f">Updated state informs the next tick</text><text x="100" y="475" font-family="Arial, sans-serif" font-size="17" fill="#25372f">SEED  /  SPROUTING  /  GROWING  /  FLOWERING  /  MATURE  /  HARVESTABLE</text><path d="M55 550 H1045" stroke="#9aa99b"/><text x="55" y="583" font-family="Arial, sans-serif" font-size="14" fill="#25372f">Environmental conditions modify updates; timing and balance remain experimental.</text><text x="886" y="583" font-family="Arial, sans-serif" font-size="11" fill="#25372f">IMPLEMENTATION SKETCH</text></svg>